[package]
name = "minuta-io"
version = "0.1.0"
description = "minuta.io — preenchimento de minutas a partir de documentos"
edition = "2021"
publish = false

[lib]
name = "minuta_io_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
